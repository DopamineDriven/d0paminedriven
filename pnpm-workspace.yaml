packages:
  - apps/*
  - packages/*
  - tooling/*

enablePrePostScripts: true
nodeLinker: hoisted
autoInstallPeers: true
minimumReleaseAge: 0
trustPolicy: "off"
trustLockfile: true
blockExoticSubdeps: false
ignorePatchFailures: true
dangerouslyAllowAllBuilds: true
verifyStoreIntegrity: false

